services:
  bot:
    build: .
    image: wa-lead-gen:latest
    container_name: wa-lead-gen
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8088:8088" # laptop-only admin UI; gateway stays internal
    volumes:
      - openclaw-data:/home/it-admin/.openclaw                       # WhatsApp creds, config, labels
      - db-data:/home/it-admin/wa-lead-gen/workspace/data            # SQLite DB + catalog + leads
      - backups:/home/it-admin/wa-lead-gen-backups                   # backups (run scripts/backup.sh)
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  openclaw-data:
  db-data:
  backups:
